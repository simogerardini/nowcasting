# Production on a small VPS (Oracle VM.Standard.E2.1.Micro: 1 GB RAM, 1/8 OCPU).
# Database: Supabase (DATABASE_URL in .env). No Redis (in-process store). api + worker in one container.
name: nowcast

services:
  app:
    build: ./backend
    image: noctalix-nowcast-backend:latest
    env_file: .env
    environment:
      PORT: "8000"
      REDIS_URL: ""
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      DB_POOL_SIZE: "2"
      DB_MAX_OVERFLOW: "2"
    volumes:
      - nowcast_data:/data      # persistent VAPID keys + radar cache + assets
    restart: unless-stopped
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    environment:
      API_DOMAIN: ${API_DOMAIN:-api-nowcast.noctalix.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
    restart: unless-stopped
    logging: { driver: json-file, options: { max-size: "5m", max-file: "2" } }

volumes:
  nowcast_data:
  caddy_data:
  caddy_config:
