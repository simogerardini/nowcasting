name: Deploy backend (VPS)

# Requires repo secrets: VPS_HOST, VPS_SSH_KEY (+ optional VPS_USER, VPS_PORT, R2_*).
# CLOUDFLARE_API_TOKEN (DNS:Edit) lets the job point api-nowcast.noctalix.com at the VPS.
on:
  push:
    branches: [main]
    paths: ["backend/**", "docker-compose.yml", "Caddyfile", "scripts/vps-deploy.sh", ".github/workflows/deploy-backend.yml"]
  workflow_dispatch:

concurrency: { group: backend, cancel-in-progress: false }

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER || 'root' }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      API_DOMAIN: api-nowcast.noctalix.com
      ZONE: noctalix.com
    steps:
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$VPS_HOST" ]; then
            echo "::notice::VPS_HOST secret not set - backend deploy skipped"; echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.skip != 'true'

      - name: Point DNS at VPS (A/AAAA, proxied)
        if: steps.cfg.outputs.skip != 'true'
        env: { CF_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}" }
        run: |
          [ -z "$CF_TOKEN" ] && { echo "::warning::no CLOUDFLARE_API_TOKEN, DNS untouched"; exit 0; }
          IP=$(getent ahosts "$VPS_HOST" | awk '{print $1; exit}')
          TYPE=A; [[ "$IP" == *:* ]] && TYPE=AAAA
          api() { curl -fsS -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" "$@"; }
          ZID=$(api "https://api.cloudflare.com/client/v4/zones?name=$ZONE" | jq -r '.result[0].id')
          RID=$(api "https://api.cloudflare.com/client/v4/zones/$ZID/dns_records?name=$API_DOMAIN" | jq -r '.result[0].id // empty')
          BODY=$(jq -nc --arg t "$TYPE" --arg n "$API_DOMAIN" --arg c "$IP" '{type:$t,name:$n,content:$c,proxied:true,ttl:1,comment:"Nowcast API (VPS)"}')
          if [ -n "$RID" ]; then api -X PUT "https://api.cloudflare.com/client/v4/zones/$ZID/dns_records/$RID" -d "$BODY" >/dev/null
          else api -X POST "https://api.cloudflare.com/client/v4/zones/$ZID/dns_records" -d "$BODY" >/dev/null; fi
          echo "$API_DOMAIN -> $IP ($TYPE)"

      - name: Sync & deploy over SSH
        if: steps.cfg.outputs.skip != 'true'
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          mkdir -p ~/.ssh && echo "$SSH_KEY" > ~/.ssh/id && chmod 600 ~/.ssh/id
          SSH="ssh -i ~/.ssh/id -p $VPS_PORT -o StrictHostKeyChecking=accept-new"
          rsync -az --delete --exclude .git --exclude frontend --exclude .env -e "$SSH" ./ "$VPS_USER@$VPS_HOST:/opt/nowcast/"
          $SSH "$VPS_USER@$VPS_HOST" \
            "R2_ACCOUNT_ID='$R2_ACCOUNT_ID' R2_ACCESS_KEY_ID='$R2_ACCESS_KEY_ID' R2_SECRET_ACCESS_KEY='$R2_SECRET_ACCESS_KEY' \
             sudo -E bash /opt/nowcast/scripts/vps-deploy.sh"

      - name: Health check
        if: steps.cfg.outputs.skip != 'true'
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "https://$API_DOMAIN/api/v1/health"; then exit 0; fi; sleep 10
          done
          echo "::error::API not healthy"; exit 1
