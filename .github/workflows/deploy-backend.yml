name: Deploy backend (VPS)

# Requires repo VARIABLE VPS_HOST (job is skipped at 0 cost while unset) and secret VPS_SSH_KEY
# and DATABASE_URL (Supabase) (+ optional secrets VPS_USER, VPS_PORT, R2_*).
# CLOUDFLARE_API_TOKEN (DNS:Edit) lets the job point api-nowcast.noctalix.com at the VPS.
on:
  push:
    branches: [main]
    paths: ["backend/app/**", "backend/worker/**", "backend/requirements.txt", "backend/Dockerfile", "backend/start.sh", "docker-compose.vps.yml", "Caddyfile", "scripts/vps-deploy.sh"]
  workflow_dispatch:

concurrency: { group: backend, cancel-in-progress: false }

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: vars.VPS_HOST != ''
    timeout-minutes: 4   # docker build runs detached on the VPS
    env:
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER || 'ubuntu' }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      API_DOMAIN: api-nowcast.noctalix.com
      ZONE: noctalix.com
    steps:
      - uses: actions/checkout@v4

      - name: Point DNS at VPS (A/AAAA, proxied) - optional
        continue-on-error: true   # DNS may already be managed elsewhere; never block the deploy
        env: { CF_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}" }
        run: |
          [ -z "$CF_TOKEN" ] && { echo "::warning::no CLOUDFLARE_API_TOKEN, DNS untouched"; exit 0; }
          IP=$(getent ahosts "$VPS_HOST" | awk '{print $1; exit}')
          TYPE=A; [[ "$IP" == *:* ]] && TYPE=AAAA
          api() { curl -fsS -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" "$@"; }
          ZID=$(api "https://api.cloudflare.com/client/v4/zones?name=$ZONE" | jq -r '.result[0].id')
          RID=$(api "https://api.cloudflare.com/client/v4/zones/$ZID/dns_records?name=$API_DOMAIN" | jq -r '.result[0].id // empty')
          BODY=$(jq -nc --arg t "$TYPE" --arg n "$API_DOMAIN" --arg c "$IP" '{type:$t,name:$n,content:$c,proxied:true,ttl:1,comment:"Nowcast API (VPS)"}')
          if [ -n "$RID" ]; then api -X PUT "https://api.cloudflare.com/client/v4/zones/$ZID/dns_records/$RID" -d "$BODY" >/dev/null
          else api -X POST "https://api.cloudflare.com/client/v4/zones/$ZID/dns_records" -d "$BODY" >/dev/null; fi
          echo "$API_DOMAIN -> $IP ($TYPE)"

      - name: Sync & deploy over SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          mkdir -p ~/.ssh && echo "$SSH_KEY" > ~/.ssh/id && chmod 600 ~/.ssh/id
          SSH="ssh -i ~/.ssh/id -p $VPS_PORT -o StrictHostKeyChecking=accept-new"
          $SSH "$VPS_USER@$VPS_HOST" "sudo mkdir -p /opt/nowcast"
          rsync -az --delete --exclude .git --exclude frontend --exclude .env --rsync-path="sudo rsync" \
            -e "$SSH" ./ "$VPS_USER@$VPS_HOST:/opt/nowcast/"
          # Detached: the (slow) Docker build runs on the VPS without holding an Actions runner.
          $SSH "$VPS_USER@$VPS_HOST" \
            "sudo env DATABASE_URL='$DATABASE_URL' R2_ACCOUNT_ID='$R2_ACCOUNT_ID' R2_ACCESS_KEY_ID='$R2_ACCESS_KEY_ID' R2_SECRET_ACCESS_KEY='$R2_SECRET_ACCESS_KEY' \
             setsid nohup bash /opt/nowcast/scripts/vps-deploy.sh > /tmp/nowcast-deploy.log 2>&1 < /dev/null &"
          echo "Deploy started on VPS. Log: ssh $VPS_USER@$VPS_HOST tail -f /tmp/nowcast-deploy.log"

      - name: Health check (single probe, non-blocking)
        run: curl -fsS --max-time 10 "https://$API_DOMAIN/api/v1/health" || echo "::notice::API not up yet (first build takes 20-40 min on a 1/8 OCPU VPS)"
